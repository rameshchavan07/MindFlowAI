name: dayscore
description: "AI-powered wellness and productivity mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  gap: ^3.0.0
  lottie: ^3.1.2
  intl: ^0.19.0

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # Integrations & APIs
  health: ^11.0.0
  permission_handler: ^11.3.1
  fl_chart: ^0.69.0
  jitsi_meet_flutter_sdk: ^12.1.3
  speech_to_text: ^7.4.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.9
  mockito: ^5.4.4

flutter:
  uses-material-design: true
